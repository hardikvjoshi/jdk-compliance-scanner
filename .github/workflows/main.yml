name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9  # Adjust if your code uses a different Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt  # Update path if necessary

      - name: Run tests
        run: |
          cd backend
          python -m unittest discover  # Modify based on your testing framework

  ui:
    name: Frontend Build and Test (UI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16  # Adjust Node.js version if needed

      - name: Install dependencies
        run: |
          cd ui
          npm install

      - name: Run build
        run: |
          cd ui
          npm run build

      - name: Run tests
        run: |
          cd ui
          npm test
